    <script>
      // Runs before the first paint (keep it small, plain and in sync with src/main.jsx):
      //  · js-motion: lets CSS hide things that animate in (skipped under reduced motion)
      //  · boot-on: show the boot screen on the first page view of this session
      //  · the accent colour the visitor picked last time
      //  · a failsafe: if the app hasn't started after 8 s, show everything without animation
      (function () {
        var d = document.documentElement, calm = false;
        try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (!calm) d.classList.add('js-motion');
        try { if (!calm && !sessionStorage.getItem('ahmar.booted')) d.classList.add('boot-on'); } catch (e) {}
        try {
          var a = JSON.parse(localStorage.getItem('ahmar.accentVars'));
          if (a && a[0]) { d.style.setProperty('--accent', a[0]); d.style.setProperty('--accent-rgb', a[1]); }
        } catch (e) {}
        setTimeout(function () { if (!window.__appStarted) d.classList.remove('js-motion', 'boot-on'); }, 8000);
      })();
    </script>
